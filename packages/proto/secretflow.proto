syntax = "proto3";

// MedTrust SecretFlow control-plane ↔ data-plane contract.
//
// The NestJS Space Orchestrator is the gRPC CLIENT; each institution's
// Local Data Agent (Python) is the gRPC SERVER. This proto is the single
// source of truth shared by both sides (Node loads it at runtime via
// @grpc/proto-loader; Python generates stubs via grpcio-tools).
package medtrust.secretflow.v1;

service SecretFlowAgent {
  // §4.1 SubmitFLTask — dispatch a federated training task to a local agent.
  rpc SubmitFLTask(SubmitFLTaskRequest) returns (SubmitFLTaskResponse);

  // Fetch the final, output-gated result once a task reaches a terminal state.
  rpc GetTaskResult(TaskRef) returns (TaskResult);

  // §4.2 ReportNodeStatus — server-streamed node liveness / attestation / metrics.
  // (Fine-grained training logs flow over the WebSocket stream advertised in
  //  SubmitFLTaskResponse.task_stream_url; this stream carries coarse status.)
  rpc ReportNodeStatus(TaskRef) returns (stream NodeStatus);
}

// Heterogeneity-adapted execution plan for a single party, produced by the
// orchestrator's NodeCapabilityService before dispatch.
message NodePlan {
  string participant_id = 1;
  string tier = 2;               // "teeu_full" | "pyu_only"
  string device = 3;             // e.g. "H100" | "V100" | "CPU"
  bool offload_aggregation = 4;  // weak node: ship encrypted features to shared TEEU pool
  uint32 local_epochs = 5;       // degraded nodes may run fewer local epochs
}

message SubmitFLTaskRequest {
  string task_id = 1;
  string spec_yaml = 2;            // declarative SecretFlowTaskSpec (YAML)
  string transpiled_payload = 3;   // generated SecretFlow/Ray script (audit + execution hint)
  string global_public_key = 4;    // HEU public key for encrypted gradient aggregation
  repeated NodePlan node_plan = 5; // per-party adapted plan
}

message SubmitFLTaskResponse {
  string task_id = 1;
  string ack_status = 2;        // "ACCEPTED" | "REJECTED"
  string task_stream_url = 3;   // ws:// URL for the live training log stream
  string message = 4;
}

message TaskRef {
  string task_id = 1;
}

message NodeStatus {
  string task_id = 1;
  string participant_id = 2;
  string hardware_attestation = 3;   // TEE attestation report hash
  uint32 current_epoch = 4;
  double loss_metric = 5;
  double estimated_time_seconds = 6;
  string phase = 7;                  // "preparing" | "training" | "aggregating" | "done" | "failed"
}

// Output-safe result. NEVER carries raw rows, DICOM payloads, VCF records,
// unencrypted gradients, or embeddings — only attested metadata + references.
message TaskResult {
  string task_id = 1;
  string state = 2;                  // "COMPLETED" | "FAILED"
  uint32 rounds_completed = 3;
  string metrics_json = 4;           // aggregate metrics only
  string lora_delta_hash = 5;
  string encrypted_delta_ref = 6;
  string attestation_report_hash = 7;
  string privacy_summary_json = 8;
  string model_card_json = 9;
  string runtime = 10;               // "secretflow_teeu" | "ray_torch" | "torch"
}
