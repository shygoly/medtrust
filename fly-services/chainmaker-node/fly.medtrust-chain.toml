# medtrust-chain = real ChainMaker node + co-located Java SDK gateway.
# Public surface is the gateway's HTTP API (the raw RPC stays localhost-only).
app = "medtrust-chain"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile.chain"

[http_service]
  internal_port = 8090
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "20s"
    timeout = "5s"
    # node boot + JVM start + contract deploy take a while; /health stays 200 and reports readiness in the body.
    grace_period = "150s"
    method = "GET"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
