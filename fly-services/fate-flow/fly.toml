app = "medtrust-fate-flow"
primary_region = "hkg"

[build]
  image = "federatedai/fate-flow:1.11.1"

[env]
  FATE_FLOW_HOST = "0.0.0.0"
  FATE_FLOW_PORT = "9380"

[http_service]
  internal_port = 9380
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[services]]
  protocol = "tcp"
  internal_port = 9380

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

[checks]
  [checks.health]
    grace_period = "30s"
    interval = "30s"
    method = "get"
    path = "/v1/version"
    timeout = "10s"
    type = "http"
