# MedTrust API — NestJS control plane (real app, replaces the demo mock).
# PostgreSQL is mandatory. DATABASE_URL and CONTROL_PLANE_DB_URL are injected as
# Fly secrets; schema changes run through explicit migrations.
app = "medtrust-api"
primary_region = "sin"

[build]
  # Path is relative to this config file's directory.
  dockerfile = "Dockerfile"

[env]
  PORT = "5021"
  # Demo mode keeps optional infrastructure degradation. Persistence is still
  # PostgreSQL and DB_SYNCHRONIZE stays false.
  NODE_ENV = "development"
  DB_SYNCHRONIZE = "false"
  # CORS origin — main.ts reads FRONTEND_URL.
  FRONTEND_URL = "https://web.szchada.top"
  # Fixed secret so JWT sessions survive restarts (demo value — rotate for real use).
  JWT_SECRET = "medtrust-demo-jwt-secret-change-me"
  # ChainMaker blockchain — HTTP sidecar endpoint.
  CHAIN_SIDECAR_URL = "https://medtrust-chain.fly.dev"
  # 迁移期开关:旧 Fly 连接器仍用静态令牌(outbound-longpoll-agent-auth D5/D8)。
  # 各院改配证书后置 false,即切换为强制证书认证。
  CONNECTOR_TOKEN_AUTH_ALLOWED = "true"
  # LoRA deliverables: persisted to Tigris when fly storage create sets BUCKET_NAME + AWS_* secrets.
  LORA_DELIVERABLE_PREFIX = "deliverables/"

[http_service]
  internal_port = 5021
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "25s"
    method = "GET"
    path = "/api/v1/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 1024
