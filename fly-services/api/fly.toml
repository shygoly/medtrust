# MedTrust API — NestJS control plane (real app, replaces the demo mock).
# SQLite is ephemeral + auto-seeded on boot (synchronize + OnModuleInit seeders),
# so no persistent volume is required for the demo.
app = "medtrust-api"
primary_region = "sin"

[build]
  # Path is relative to this config file's directory.
  dockerfile = "Dockerfile"

[env]
  PORT = "5021"
  # development mode: enables TypeORM synchronize (ephemeral SQLite gets schema +
  # seed data on boot) and graceful-degrade for optional infra (Vault). Demo only.
  NODE_ENV = "development"
  # CORS origin — main.ts reads FRONTEND_URL.
  FRONTEND_URL = "https://medtrust-web.fly.dev"
  # Fixed secret so JWT sessions survive restarts (demo value — rotate for real use).
  JWT_SECRET = "medtrust-demo-jwt-secret-change-me"
  # ChainMaker blockchain — HTTP sidecar endpoint.
  CHAIN_SIDECAR_URL = "https://medtrust-chain.fly.dev"
  AGENT_GRPC_URL = "medtrust-connector-a.internal:5024"
  AGENT_GRPC_ROUTING = "hospital-huashan=medtrust-connector-a.internal:5024,hospital-ruijin=medtrust-connector-b.internal:5024"
  # LoRA deliverables: persisted to Tigris when fly storage create sets BUCKET_NAME + AWS_* secrets.
  LORA_DELIVERABLE_PREFIX = "deliverables/"

[http_service]
  internal_port = 5021
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "25s"
    method = "GET"
    path = "/api/v1/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 1024
