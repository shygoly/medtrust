# FISCO BCOS 单节点轻量版
# 演示环境只需要1个节点，数据使用临时存储

app = "medtrust-lite-fisco"
primary_region = "sin"

[build]
  image = "fiscoorg/fiscobcos:v3.6.0"

[env]
  NODE_ID = "node1"
  LISTEN_IP = "0.0.0.0"
  P2P_LISTEN_PORT = "20200"
  RPC_LISTEN_PORT = "8545"
  # 轻量级配置
  ENABLE_SSL = "false"
  LOG_LEVEL = "warning"

[http_service]
  internal_port = 8545
  force_https = false
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

# 最小资源 + 临时存储（不使用volume，降低成本）
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[[services]]
  protocol = "tcp"
  internal_port = 8545

  [[services.ports]]
    port = 8545

[[services]]
  protocol = "tcp"
  internal_port = 20200

  [[services.ports]]
    port = 20200

[checks]
  [checks.health]
    grace_period = "30s"
    interval = "60s"
    method = "post"
    path = "/"
    timeout = "10s"
    type = "http"
    headers = { "Content-Type" = "application/json" }
    body = '{"jsonrpc":"2.0","method":"getBlockNumber","params":[1],"id":1}'
