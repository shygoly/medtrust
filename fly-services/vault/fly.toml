# MedTrust Vault — HashiCorp Vault (Reference, non-Fly.io)
# Role: key management center. Stores SM4 DEK (90-day rotation), SM2 CA root key
#       (2-year rotation), per-connector salts, per-round FL session keys.
# NOTE: This is a REFERENCE configuration. Vault should be deployed independently
# on hardened infrastructure, not on Fly.io shared machines.
# For local dev, use: docker-compose up -d vault (dev token: dev-token-12345)

app = "medtrust-vault-ref"
primary_region = "sin"

[build]
  image = "hashicorp/vault:1.18"

[env]
  VAULT_LOCAL_CONFIG = '{"listener":[{"tcp":{"address":"0.0.0.0:8200","tls_disable":true}}],"storage":{"file":{"path":"/vault/data"}},"ui":true,"api_addr":"http://0.0.0.0:8200"}'
  VAULT_DEV_ROOT_TOKEN_ID = "dev-token-12345"
  VAULT_DEV_LISTEN_ADDRESS = "0.0.0.0:8200"
  # Production config (uncomment when not in dev mode):
  # VAULT_ADDR = "https://medtrust-vault.internal:8200"
  # Key rotation schedules (audit correction #16):
  # SM4 DEK: 90-day rotation
  # SM2 CA root: 2-year rotation
  # Cert auto-renewal reminder: 14 days before expiry

[http_service]
  internal_port = 8200
  force_https = true
  auto_stop_machines = false     # must always be available
  auto_start_machines = true
  min_machines_running = 1

[[services]]
  protocol = "tcp"
  internal_port = 8200

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[mounts]
  source = "vault_data"
  destination = "/vault/data"

[checks]
  [checks.health]
    grace_period = "10s"
    interval = "30s"
    method = "get"
    path = "/v1/sys/health"
    timeout = "5s"
    type = "http"
