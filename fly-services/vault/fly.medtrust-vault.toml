# MedTrust Vault — real HashiCorp Vault (dev mode), replaces the mock.
app = "medtrust-vault"
primary_region = "sin"

[build]
  image = "hashicorp/vault:1.18"

# Official image needs `server -dev` to start an in-memory unsealed dev server.
[experimental]
  cmd = ["server", "-dev"]

[env]
  VAULT_DEV_ROOT_TOKEN_ID = "dev-token-12345"
  VAULT_DEV_LISTEN_ADDRESS = "0.0.0.0:8200"

[http_service]
  internal_port = 8200
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/v1/sys/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
