app = "medtrust-mp-spdz-gateway"
primary_region = "hkg"

[build]
  dockerfile = "Dockerfile"

[env]
  GATEWAY_PORT = "8080"
  SPDZ_PROTOCOL = "shamir"
  SPDZ_PARTIES = "3"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[services]]
  protocol = "tcp"
  internal_port = 8080

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

[checks]
  [checks.health]
    grace_period = "30s"
    interval = "30s"
    method = "get"
    path = "/health"
    timeout = "5s"
    type = "http"
