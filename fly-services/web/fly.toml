# MedTrust Web — Next.js 16 console (real app, replaces the demo mock).
app = "medtrust-web"
primary_region = "sin"

[build]
  # Path is relative to this config file's directory.
  dockerfile = "Dockerfile"
  # NEXT_PUBLIC_* are inlined at build time — pass the public API/WS URLs here.
  [build.args]
    NEXT_PUBLIC_API_URL = "https://api.szchada.top/api/v1"
    NEXT_PUBLIC_WS_URL = "wss://api.szchada.top"
    NEXT_PUBLIC_CONNECTOR_DATA_PATH = "/data/rws-injected"

[env]
  PORT = "5020"
  NODE_ENV = "production"

[http_service]
  internal_port = 5020
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/login"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
