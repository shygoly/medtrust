# medtrust-rws-worker-a = NestJS RWS outbound-pull worker (华山医院, p-huashan).
# Separate from medtrust-connector-a (Python SecretFlow agent on :5024).
app = "medtrust-rws-worker-a"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile.connector"
  [build.args]
    SYNTHEA_CONNECTOR = "huashan"

[env]
  CONNECTOR_PARTICIPANT_ID = "p-huashan"
  CONTROL_PLANE_URL = "https://medtrust-api.fly.dev/api/v1"
  CONNECTOR_PULL_TOKEN = "dev-connector-token"
  CONNECTOR_POLL_INTERVAL_MS = "5000"
  CONNECTOR_DATA_ROOT = "/"
  CONNECTOR_CATALOG_WARMUP = "dp-insulin-panc-huashan"
  # L3 因果：本院 Python agent（与 FL 同一 gRPC :5024）
  AGENT_GRPC_URL = "medtrust-connector-a.internal:5024"

[http_service]
  internal_port = 5022
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "25s"
    method = "GET"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
