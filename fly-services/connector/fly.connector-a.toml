# medtrust-connector-a = real Local Data Agent (provider node, 华山医院).
app = "medtrust-connector-a"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile.agent"
  [build.args]
    SYNTHEA_CONNECTOR = "huashan"

[env]
  AGENT_PARTICIPANT_ID = "hospital-a-huashan"
  AGENT_LOCAL_PARTY = "hospital-huashan"
  AGENT_WS_HOST = "::"
  AGENT_WS_ADVERTISE_HOST = "medtrust-connector-a.internal"
  AGENT_DATA_PATH = "/data/synthea/ingested"
  # RWS outbound-pull worker (apps/connector ConnectorWorkerService)
  CONNECTOR_PARTICIPANT_ID = "hospital-a-huashan"
  CONTROL_PLANE_URL = "https://medtrust-api.fly.dev/api/v1"
  CONNECTOR_PULL_TOKEN = "dev-connector-token"

# gRPC SecretFlowAgent endpoint (orchestrator dials this via AGENT_GRPC_URL).
[[services]]
  internal_port = 5024
  protocol = "tcp"
  [[services.ports]]
    port = 5024
  [[services.tcp_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "25s"

# WebSocket training-log stream (agent-log-bridge connects here).
[[services]]
  internal_port = 5023
  protocol = "tcp"
  [[services.ports]]
    port = 5023

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
