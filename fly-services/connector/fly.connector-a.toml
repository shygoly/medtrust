# medtrust-connector-a = real Local Data Agent (provider node, 华山医院).
app = "medtrust-connector-a"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile.agent"
  [build.args]
    SYNTHEA_CONNECTOR = "huashan"

[env]
  AGENT_PARTICIPANT_ID = "hospital-a-huashan"
  AGENT_LOCAL_PARTY = "hospital-huashan"
  AGENT_WS_HOST = "::"
  AGENT_WS_ADVERTISE_HOST = "medtrust-connector-a.internal"
  AGENT_DATA_PATH = "/data/synthea/ingested"
  # RWS worker lives in medtrust-rws-worker-a (NestJS), NOT this Python agent image.

# gRPC SecretFlowAgent endpoint (orchestrator dials this via AGENT_GRPC_URL).
[[services]]
  internal_port = 5024
  protocol = "tcp"
  [[services.ports]]
    port = 5024
  [[services.tcp_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "25s"

# WebSocket training-log stream — 缺省关闭(AGENT_WS_ENABLED=false);
# 平台不再连入 agent,训练进度由连接器回传轮次指标。
# AGENT_SHARED_TOKEN 为密钥,用 `fly secrets set` 注入(连接器同值)。
[[services]]
  internal_port = 5023
  protocol = "tcp"
  [[services.ports]]
    port = 5023

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
