<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 660" role="img" width="1060" height="660"
     aria-label="医院连接器接入网络拓扑：医院内网(HIS核心区、最小权限脱敏视图、DMZ内的连接器/计算后端/可选联盟链节点/跳板机)经出口防火墙仅主动出站到平台控制面(443)；运维经跳板机受控入站(VPN可选)；可选联盟链节点与联盟成员P2P双向。出院的只有聚合结果与签名模型增量。">
  <style>
    .bg    { fill:#f3f6f5; }
    .zone  { fill:#e8eeed; stroke:#cfd9d7; stroke-width:1; }
    .plat  { fill:#eef3f2; stroke:#b1bfbc; stroke-width:1; }
    .box   { fill:#ffffff; stroke:#b1bfbc; stroke-width:1; }
    .grp   { fill:none; stroke:#7f8e8b; stroke-width:1; stroke-dasharray:5 4; }
    .opt   { fill:#ffffff; stroke:#a86a12; stroke-width:1.3; stroke-dasharray:5 4; }
    .ext   { fill:#ffffff; stroke:#b1bfbc; stroke-width:1; stroke-dasharray:2 3; }
    .t     { font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif; fill:#172220; font-size:13px; }
    .b     { font-weight:600; }
    .s     { font-size:11.5px; }
    .xs    { font-size:10.5px; }
    .dim   { fill:#4b5b58; }
    .faint { fill:#7f8e8b; }
    .jade  { fill:#0c8378; }
    .amber { fill:#a86a12; }
    .purp  { fill:#5b53b0; }
    .red   { fill:#b93a2c; }
    .e     { fill:none; stroke-width:1.4; }
    .e-ink { stroke:#4b5b58; }
    .e-jade{ stroke:#0c8378; stroke-width:2.6; }
    .e-purp{ stroke:#5b53b0; stroke-width:1.8; stroke-dasharray:6 3; }
    .e-amber{ stroke:#a86a12; stroke-width:1.6; stroke-dasharray:6 4; }
    .fw    { stroke:#b93a2c; stroke-width:1.6; stroke-dasharray:2 4; }
  </style>
  <defs>
    <marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5b58"/></marker>
    <marker id="mj" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0c8378"/></marker>
    <marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b53b0"/></marker>
    <marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a86a12"/></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1060" height="660"/>

  <!-- ===================== 医院内网 ===================== -->
  <rect class="zone" x="20" y="20" width="620" height="480" rx="10"/>
  <text class="t b" x="40" y="46">医院内网 · 自有机房</text>
  <text class="t s faint" x="188" y="46">默认无外网入站</text>

  <!-- HIS 核心区 -->
  <rect class="box" x="44" y="68" width="256" height="92" rx="6"/>
  <text class="t b" x="60" y="92">HIS / EMR 核心库</text>
  <text class="t s dim" x="60" y="114">原始 / 明文数据留在此，不出 HIS</text>
  <text class="t xs faint" x="60" y="136">业务内网核心区</text>

  <!-- 脱敏视图 -->
  <rect class="box" x="44" y="180" width="256" height="92" rx="6"/>
  <text class="t b" x="60" y="204">只读 + 脱敏视图</text>
  <text class="t s dim" x="60" y="226">最小权限接口层 · 不直连底层库</text>
  <text class="t xs faint" x="60" y="248">目标态 OMOP CDM 视图</text>

  <!-- DMZ 前置机区 -->
  <rect class="grp" x="326" y="62" width="290" height="410" rx="8"/>
  <text class="t s b faint" x="342" y="82">DMZ / 前置机区（与 HIS 核心区网络分隔）</text>

  <!-- 连接器 -->
  <rect class="box" x="344" y="96" width="256" height="104" rx="6"/>
  <text class="t b" x="360" y="120">院内连接器 · NestJS</text>
  <text class="t s dim" x="360" y="142">管理面 :5022 仅 127.0.0.1 · 不发布端口</text>
  <text class="t s dim" x="360" y="162">PEP 合约校验 · 本地库守卫 · 去标识</text>
  <text class="t s dim" x="360" y="182">输出闸门（小格≥5）· 先算 SM3</text>

  <!-- agent -->
  <rect class="box" x="344" y="214" width="256" height="88" rx="6"/>
  <text class="t b" x="360" y="238">计算后端 agent · Python</text>
  <text class="t s dim" x="360" y="260">gRPC :5024 · 仅院内可达</text>
  <text class="t s dim" x="360" y="282">L3 因果 / L4 联邦训练 · 共享令牌</text>

  <!-- 可选链节点 -->
  <rect class="opt" x="344" y="316" width="256" height="66" rx="6"/>
  <text class="t b amber" x="360" y="338">（可选）联盟链节点 · ChainMaker</text>
  <text class="t s dim" x="360" y="360">Sidecar :8090 · P2P :11301 双向</text>

  <!-- 跳板机 -->
  <rect class="box" x="344" y="396" width="256" height="64" rx="6"/>
  <text class="t b" x="360" y="420">跳板机 / 堡垒机（bastion）</text>
  <text class="t s dim" x="360" y="442">运维经此访问连接器管理面 · SSH+MFA</text>

  <!-- 院内边 -->
  <line class="e e-ink" x1="344" y1="150" x2="302" y2="208" marker-end="url(#mi)"/>
  <text class="t xs dim" x="338" y="188" text-anchor="end">只读拉取</text>
  <line class="e e-ink" x1="472" y1="202" x2="472" y2="212" marker-start="url(#mi)" marker-end="url(#mi)"/>
  <text class="t xs dim" x="480" y="211">院内令牌</text>
  <path class="e e-purp" d="M344 420 H320 V176 H342" marker-end="url(#mp)"/>
  <text class="t xs purp" x="314" y="300" text-anchor="end">管理面</text>

  <!-- ===================== 出口防火墙 ===================== -->
  <line class="fw" x1="664" y1="26" x2="664" y2="486"/>
  <text class="t s b red" x="656" y="46" text-anchor="end">医院出口防火墙</text>
  <text class="t xs jade" x="672" y="104">✅ 出站 :443</text>
  <text class="t xs red" x="672" y="188">❌ 入站全拒</text>
  <text class="t xs amber" x="672" y="258">⚠ 可选 P2P</text>
  <text class="t xs purp" x="672" y="420">🔒 运维通道</text>

  <!-- ===================== 平台控制面 ===================== -->
  <rect class="plat" x="744" y="20" width="296" height="150" rx="10"/>
  <text class="t b" x="762" y="44">平台控制面（院外）</text>
  <rect class="box" x="762" y="54" width="260" height="48" rx="6"/>
  <text class="t b" x="776" y="76">控制面 API</text>
  <text class="t s dim" x="776" y="94">HTTPS :443 · 长轮询下发 · 平台签名</text>
  <rect class="box" x="762" y="112" width="260" height="48" rx="6"/>
  <text class="t b" x="776" y="134">长安链 ChainMaker</text>
  <text class="t s dim" x="776" y="152">存证（当前平台单节点）</text>

  <!-- 联盟成员节点（可选） -->
  <rect class="ext" x="744" y="192" width="296" height="68" rx="8"/>
  <text class="t b amber" x="762" y="216">联盟成员机构节点</text>
  <text class="t s dim" x="762" y="236">其他医院 / 药企 / 运营</text>
  <text class="t xs faint" x="762" y="254">仅当院方自建链节点时互通</text>

  <!-- ===================== MedTrust 运维 ===================== -->
  <rect class="plat" x="744" y="384" width="296" height="92" rx="10"/>
  <text class="t b" x="762" y="408">MedTrust 运维</text>
  <text class="t s dim" x="762" y="430">运维终端 · 部署 / 状态 / 日志</text>
  <text class="t s dim" x="762" y="450">VPN 网关（可选）或跳板机公网口</text>
  <text class="t xs faint" x="762" y="468">仅达跳板机，不触达原始数据</text>

  <!-- ===================== 跨界边 ===================== -->
  <!-- 仅出站主链路 -->
  <path class="e e-jade" d="M600 126 C690 126 700 78 760 78" marker-end="url(#mj)"/>
  <text class="t s jade b" x="686" y="118">仅出站</text>
  <text class="t xs jade" x="612" y="70">长轮询 · SM2 证书 · 回传聚合结果 + SM3</text>

  <!-- 运维经跳板机受控入站 -->
  <path class="e e-purp" d="M744 424 H602" marker-end="url(#mp)"/>
  <text class="t xs purp" x="672" y="438">SSH（VPN 可选）· 受控入站</text>

  <!-- 可选联盟链 P2P 双向 -->
  <path class="e e-amber" d="M600 344 C690 344 702 228 742 228" marker-end="url(#ma)"/>
  <path class="e e-amber" d="M742 246 C702 246 690 362 602 362" marker-end="url(#ma)"/>
  <text class="t xs amber" x="628" y="326">P2P 双向</text>

  <!-- ===================== 图例 ===================== -->
  <g transform="translate(44,524)">
    <text class="t b" x="0" y="0">图例</text>
    <line class="e e-jade" x1="0" y1="24" x2="34" y2="24"/>
    <text class="t s dim" x="42" y="28">数据主链路 · 仅由连接器主动出站</text>
    <line class="e e-ink" x1="356" y1="24" x2="390" y2="24"/>
    <text class="t s dim" x="398" y="28">院内链路（不跨院边界）</text>
    <line class="e e-purp" x1="0" y1="50" x2="34" y2="50"/>
    <text class="t s dim" x="42" y="54">运维接入 · 经跳板机（VPN 可选）</text>
    <line class="e e-amber" x1="356" y1="50" x2="390" y2="50"/>
    <text class="t s dim" x="398" y="54">可选 · 联盟链节点 P2P（双向）</text>
    <line class="fw" x1="0" y1="76" x2="34" y2="76"/>
    <text class="t s dim" x="42" y="80">医院出口防火墙</text>
    <text class="t s faint" x="356" y="80">出院的只有聚合结果与签名模型增量，单行数据不出院</text>
  </g>
</svg>
