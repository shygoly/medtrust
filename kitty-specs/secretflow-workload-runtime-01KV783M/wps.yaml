subtasks:
  T001:
    title: "Define SecretFlowTaskSpec and related domain types"
    description: "Create TypeScript interfaces for parties, modalities, backbone, PEFT, fusion bridge, privacy, and output policy."
  T002:
    title: "Add structural validation predicates"
    description: "Add narrow helper predicates for required SecretFlow spec sections without importing external runtimes."
  T003:
    title: "Add spec shape tests"
    description: "Cover valid and invalid SecretFlowTaskSpec shapes in API or connector unit tests."
  T004:
    title: "Extend CreateComputeTaskDto for SecretFlow"
    description: "Ensure DTO typing accepts algorithmParams.secretflowSpec for secretflow workload tasks."
  T005:
    title: "Implement API validateWorkloadSpec for SECRETFLOW"
    description: "Reject missing parties, modalities, backbone, PEFT, and invalid method values with clear 400 errors."
  T006:
    title: "Add API validation tests"
    description: "Service-level tests for valid secretflow task creation and invalid spec rejection."
  T007:
    title: "Introduce connector workload dispatch boundary"
    description: "Refactor connector-task-runner to route by workloadType without changing RWS behavior."
  T008:
    title: "Add SecretFlowTaskRunner shell"
    description: "Create secretflow-task-runner and wire secretflow dispatches to it."
  T009:
    title: "Add connector routing tests"
    description: "Prove RWS still works and secretflow routes to the SecretFlow runner shell."
  T010:
    title: "Define SecretFlowRuntimeAdapter interface"
    description: "Specify validateEnvironment, prepare, run, and cleanup lifecycle methods."
  T011:
    title: "Implement MockSecretFlowAdapter"
    description: "Return deterministic mock outputs derived from task id and spec content."
  T012:
    title: "Add mock adapter unit tests"
    description: "Cover environment validation, preparation, run result, and cleanup."
  T013:
    title: "Define SecretFlowRunResult envelope"
    description: "Model safe artifacts including LoRA delta hash, encrypted delta ref, metrics, and attestation summary."
  T014:
    title: "Add output guard checks"
    description: "Block or omit raw DICOM, VCF, patient rows, unencrypted gradients, and embeddings from results."
  T015:
    title: "Add safe output contract tests"
    description: "Assert required safe fields exist and disallowed field names are absent."
  T016:
    title: "Extend web SecretFlow task types"
    description: "Add frontend types for SecretFlow specs where clients need them."
  T017:
    title: "Update /docs SecretFlow section"
    description: "Document mock MVP, workloadType vs method, and future adapter roadmap."
  T018:
    title: "Verify web build"
    description: "Run pnpm --filter web build to confirm docs route still compiles."

