openapi: 3.0.3
info:
  title: SecretFlow Compute Task Contract
  version: 0.1.0
  description: MVP contract for creating governed SecretFlow workload tasks in MedTrust.
paths:
  /api/v1/compute-tasks:
    post:
      summary: Create a SecretFlow workload task
      operationId: createSecretFlowComputeTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSecretFlowComputeTaskRequest'
      responses:
        '201':
          description: Task accepted and persisted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputeTask'
        '400':
          description: Invalid SecretFlow task specification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    CreateSecretFlowComputeTaskRequest:
      type: object
      required:
        - name
        - method
        - workloadType
        - algorithmParams
      properties:
        name:
          type: string
        description:
          type: string
        method:
          type: string
          enum: [tee, mpc]
        workloadType:
          type: string
          enum: [secretflow]
        contractId:
          type: string
        dataProductId:
          type: string
        algorithmParams:
          type: object
          required:
            - secretflowSpec
          properties:
            secretflowSpec:
              $ref: '#/components/schemas/SecretFlowTaskSpec'
    SecretFlowTaskSpec:
      type: object
      required:
        - parties
        - modalities
        - llmBackbone
        - peftStrategy
        - privacy
        - outputPolicy
      properties:
        parties:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SecretFlowParty'
        modalities:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SecretFlowModality'
        llmBackbone:
          $ref: '#/components/schemas/SecretFlowBackbone'
        peftStrategy:
          $ref: '#/components/schemas/SecretFlowPeftStrategy'
        fusionBridge:
          $ref: '#/components/schemas/SecretFlowFusionBridge'
        privacy:
          $ref: '#/components/schemas/SecretFlowPrivacy'
        outputPolicy:
          $ref: '#/components/schemas/SecretFlowOutputPolicy'
    SecretFlowParty:
      type: object
      required: [participantId, role]
      properties:
        participantId:
          type: string
        role:
          type: string
          enum: [provider, consumer, coordinator]
        spaceId:
          type: string
        connectorId:
          type: string
        dataResidency:
          type: string
    SecretFlowModality:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [dicom, genomics, clinical_text, structured_ehr]
        dataProductId:
          type: string
        manifestUri:
          type: string
        count:
          type: integer
          minimum: 0
        schema:
          type: string
    SecretFlowBackbone:
      type: object
      required: [modelType, modelNameOrPath]
      properties:
        modelType:
          type: string
        modelNameOrPath:
          type: string
    SecretFlowPeftStrategy:
      type: object
      required: [type, r, alpha, targetModules]
      properties:
        type:
          type: string
          enum: [lora]
        r:
          type: integer
          minimum: 1
        alpha:
          type: integer
          minimum: 1
        targetModules:
          type: array
          minItems: 1
          items:
            type: string
    SecretFlowFusionBridge:
      type: object
      required: [type, hiddenSize]
      properties:
        type:
          type: string
          enum: [linear_projection, perceiver_resampler]
        hiddenSize:
          type: integer
          minimum: 1
        numQueries:
          type: integer
          minimum: 1
    SecretFlowPrivacy:
      type: object
      required: [teeRequired, heuEnabled]
      properties:
        teeRequired:
          type: boolean
        heuEnabled:
          type: boolean
        dpSgd:
          type: object
          required: [clipNorm, noiseMultiplier]
          properties:
            clipNorm:
              type: number
              minimum: 0
            noiseMultiplier:
              type: number
              minimum: 0
            targetEpsilon:
              type: number
              minimum: 0
    SecretFlowOutputPolicy:
      type: object
      required: [allowedArtifacts]
      properties:
        allowedArtifacts:
          type: array
          minItems: 1
          items:
            type: string
            enum:
              - lora_delta_hash
              - encrypted_delta_ref
              - aggregate_metrics
              - attestation_report
              - model_card
    ComputeTask:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        workloadType:
          type: string
        method:
          type: string
        status:
          type: string
    ErrorResponse:
      type: object
      properties:
        statusCode:
          type: integer
        message:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        error:
          type: string
