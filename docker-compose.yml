version: '3.8'

services:
  vault:
    image: hashicorp/vault:1.15
    container_name: medtrust-vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-token-12345
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    command: server -dev
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - medtrust-network

  db:
    image: postgres:15-alpine
    container_name: medtrust-db
    environment:
      POSTGRES_DB: medtrust
      POSTGRES_USER: medtrust
      POSTGRES_PASSWORD: medtrust_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - medtrust-network

networks:
  medtrust-network:
    driver: bridge

volumes:
  postgres_data:
