version: '3.8'

services:
  vault:
    image: hashicorp/vault:1.15
    container_name: medtrust-vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-token-12345
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    command: server -dev
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - medtrust-network

  db:
    image: postgres:15-alpine
    container_name: medtrust-db
    environment:
      POSTGRES_DB: medtrust
      POSTGRES_USER: medtrust
      POSTGRES_PASSWORD: medtrust_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - medtrust-network

  # Synthea — synthetic patient FHIR data generator
  synthea:
    image: smartonfhir/synthea:latest
    container_name: medtrust-synthea
    profiles: ["synthea"]
    volumes:
      - ./data/synthea/output:/output
    command: >
      -p 100
      -cs 12345
      -a 40-80
      --exporter.fhir.export true
      --exporter.csv.export false
      --exporter.fhir.use_shr_extensions false
      -m metabolic_syndrome_disease
      -m cardiovascular_disease
      -m breast_cancer
      -m colorectal_cancer
      -m lung_cancer
      -m copd
      -m chronic_kidney_disease
      -m hypertension
      -m type_2_diabetes
    networks:
      - medtrust-network

networks:
  medtrust-network:
    driver: bridge

volumes:
  postgres_data:
